name = "nekuma-finance"
pages_build_output_dir = "outputs/finance-pwa-online"
compatibility_date = "2026-09-09"

[vars]
STRIPE_BILLING_MODE = "test"
STRIPE_TEST_ACCESS_ENABLED = "true"
PAYPAL_SANDBOX_ACCESS_ENABLED = "true"
PAYPAL_BILLING_MODE = "sandbox"
PAYPAL_SANDBOX_PROFILE = "jp"
PAYPAL_SANDBOX_LEDGER_ENABLED = "true"
PAYPAL_SANDBOX_DISPUTES_ENABLED = "true"

[env.production.vars]
STRIPE_BILLING_MODE = "test"
STRIPE_TEST_ACCESS_ENABLED = "true"
PAYPAL_SANDBOX_ACCESS_ENABLED = "true"
PAYPAL_BILLING_MODE = "sandbox"
PAYPAL_SANDBOX_PROFILE = "jp"
PAYPAL_SANDBOX_LEDGER_ENABLED = "true"
PAYPAL_SANDBOX_DISPUTES_ENABLED = "true"

[ai]
binding = "AI"

[[d1_databases]]
binding = "BINANCE_DB"
database_name = "nekuma-binance"
database_id = "7c6b5f8b-4956-49a0-8a2c-16efa0cf945c"

[env.production.ai]
binding = "AI"

[[env.production.d1_databases]]
binding = "BINANCE_DB"
database_name = "nekuma-binance"
database_id = "7c6b5f8b-4956-49a0-8a2c-16efa0cf945c"
